apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app
  namespace: vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vote-app"
        vault.hashicorp.com/agent-inject-secret: "secret/data/voting-app"
        vault.hashicorp.com/agent-inject-template: |
          {{- with secret "secret/data/voting-app" -}}
          POSTGRES_HOST={{ .Data.data.postgres_host }}
          POSTGRES_PORT={{ .Data.data.postgres_port }}
          POSTGRES_USER={{ .Data.data.postgres_user }}
          POSTGRES_PASSWORD={{ .Data.data.postgres_password }}
          POSTGRES_DB={{ .Data.data.postgres_db }}
          REDIS_HOST={{ .Data.data.redis_host }}
          REDIS_PORT={{ .Data.data.redis_port }}
          REDIS_PASSWORD={{ .Data.data.redis_password }}
          JWT_SECRET={{ .Data.data.jwt_secret }}
          {{- end }}
    spec:
      serviceAccountName: vote-app
      containers:
        - name: voting-app
          image: youniss606/voting-app:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
