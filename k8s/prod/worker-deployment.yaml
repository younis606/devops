apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-worker
  namespace: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-worker
  template:
    metadata:
      labels:
        app: vote-worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vote-app"
        vault.hashicorp.com/agent-inject-secret: "secret/data/voting-app"
    spec:
      serviceAccountName: vote-app
      containers:
        - name: worker
          image: youniss606/vote-worker:latest
          envFrom:
            - configMapRef:
                name: vote-config
