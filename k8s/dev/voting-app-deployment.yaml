apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vote-app-dev"
        vault.hashicorp.com/agent-inject-secret: "secret/data/voting-app-dev"
        vault.hashicorp.com/agent-inject-template: |
          {{- with secret "secret/data/voting-app-dev" -}}
          POSTGRES_HOST={{ .Data.data.postgres_host }}
          POSTGRES_PORT={{ .Data.data.postgres_port }}
          POSTGRES_USER={{ .Data.data.postgres_user }}
          POSTGRES_PASSWORD={{ .Data.data.postgres_password }}
          POSTGRES_DB={{ .Data.data.postgres_db }}
          REDIS_HOST={{ .Data.data.redis_host }}
          REDIS_PORT={{ .Data.data.redis_port }}
          REDIS_PASSWORD={{ .Data.data.redis_password }}
          JWT_SECRET={{ .Data.data.jwt_secret }}
          {{- end }}
    spec:
      serviceAccountName: vote-app
      containers:
        - name: voting-app
          image: youniss606/voting-app:dev
          ports:
            - containerPort: 80
