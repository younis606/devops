apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vote-app-access
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              env: dev
        - namespaceSelector:
            matchLabels:
              env: vote
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
